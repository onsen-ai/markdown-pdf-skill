<svg xmlns="http://www.w3.org/2000/svg" width="440" height="240" viewBox="0 0 440 240" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="440" height="240" fill="#ffffff"/>
  <text x="20" y="28" font-size="14" font-weight="600" fill="#111">Pages rendered per run</text>

  <!-- axis -->
  <line x1="40" y1="200" x2="420" y2="200" stroke="#999" stroke-width="1"/>
  <line x1="40" y1="60" x2="40" y2="200" stroke="#999" stroke-width="1"/>

  <!-- bars (neutral demo data) -->
  <rect x="70"  y="150" width="50" height="50"  fill="#4c78a8"/>
  <rect x="150" y="110" width="50" height="90"  fill="#4c78a8"/>
  <rect x="230" y="80"  width="50" height="120" fill="#4c78a8"/>
  <rect x="310" y="120" width="50" height="80"  fill="#4c78a8"/>

  <!-- labels -->
  <text x="95"  y="216" font-size="11" fill="#333" text-anchor="middle">Mon</text>
  <text x="175" y="216" font-size="11" fill="#333" text-anchor="middle">Tue</text>
  <text x="255" y="216" font-size="11" fill="#333" text-anchor="middle">Wed</text>
  <text x="335" y="216" font-size="11" fill="#333" text-anchor="middle">Thu</text>

  <text x="95"  y="144" font-size="11" fill="#111" text-anchor="middle">12</text>
  <text x="175" y="104" font-size="11" fill="#111" text-anchor="middle">28</text>
  <text x="255" y="74"  font-size="11" fill="#111" text-anchor="middle">41</text>
  <text x="335" y="114" font-size="11" fill="#111" text-anchor="middle">33</text>
</svg>
